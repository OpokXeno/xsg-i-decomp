name: Format Check

on:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt update
          sudo apt install -y clang-format

      - name: Check Formatting
        run: |
          find src platform \
            \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.hpp" \) \
            | xargs clang-format --dry-run --Werror